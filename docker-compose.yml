services:
  postgres-dev:
    image: postgres:16
    container_name: postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    profiles:
      - apps
    build:
      context: ./Auth
    image: rabbit-auth
    container_name: auth-app
    depends_on:
      postgres-dev:
        condition: service_healthy
    environment:
      AUTH_DATASOURCE_URL: jdbc:postgresql://postgres-dev:5432/auth
      AUTH_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      AUTH_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-localhost}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-/}
      RABBITMQ_SSL_ENABLED: ${RABBITMQ_SSL_ENABLED:-false}
      AUTH_SERVER_PORT: 8080
    ports:
      - "${AUTH_HOST_PORT:-8080}:8080"

  email:
    profiles:
      - apps
    build:
      context: ./email
    image: rabbit-email
    container_name: email-app
    depends_on:
      postgres-dev:
        condition: service_healthy
    environment:
      EMAIL_DATASOURCE_URL: jdbc:postgresql://postgres-dev:5432/email
      EMAIL_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      EMAIL_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-localhost}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VIRTUAL_HOST:-/}
      RABBITMQ_SSL_ENABLED: ${RABBITMQ_SSL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP_FROM in .env}
      SMTP_DEBUG: ${SMTP_DEBUG:-false}
      EMAIL_SERVER_PORT: 8081
    ports:
      - "${EMAIL_HOST_PORT:-8081}:8081"

volumes:
  postgres_dev_data:
