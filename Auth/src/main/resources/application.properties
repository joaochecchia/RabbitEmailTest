spring.application.name=Auth
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties],optional:file:./Auth/.env[.properties]

# Configuracao do Banco de Dados
spring.datasource.url=${AUTH_DATASOURCE_URL:jdbc:postgresql://localhost:5436/auth}
spring.datasource.username=${AUTH_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${AUTH_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

server.port=${AUTH_SERVER_PORT:${SERVER_PORT:8080}}
