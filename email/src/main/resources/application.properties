spring.application.name=email
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties],optional:file:./email/.env[.properties]

# Configuracao do Banco de Dados
spring.datasource.url=${EMAIL_DATASOURCE_URL:jdbc:postgresql://localhost:5436/email}
spring.datasource.username=${EMAIL_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${EMAIL_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SMTP / Email
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
spring.mail.default-encoding=UTF-8
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=${SMTP_DEBUG:false}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}

spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

server.port=${EMAIL_SERVER_PORT:${SERVER_PORT:8081}}
